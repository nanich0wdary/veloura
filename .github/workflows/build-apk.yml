# .github/workflows/build-apk.yml
# =============================================================
#  Veloura — GitHub Actions APK Builder
#
#  Triggers:
#    • every push to main → builds APK, uploads as artifact
#    • git tag  v*        → creates a GitHub Release with APK
#    • manual trigger     → Actions tab → Run workflow
#
#  To download the APK:
#    Actions tab → latest run → Artifacts → veloura-apks-*
# =============================================================

name: Build Veloura APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────
  #  BUILD
  # ───────────────────────────────────────────────────────────
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.22.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Code generation (Hive/Riverpod)
        run: flutter pub run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build split-ABI release APKs
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build universal APK
        run: flutter build apk --release

      - name: Show APK sizes
        run: |
          echo "──────────────────────────────────"
          echo "  Veloura APK files:"
          echo "──────────────────────────────────"
          find build/app/outputs/flutter-apk/ -name "*.apk" \
            -exec sh -c 'printf "  %-10s  %s\n" "$(du -sh "$1"|cut -f1)" "$1"' _ {} \;

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veloura-apks-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ───────────────────────────────────────────────────────────
  #  RELEASE  (only on version tags like v1.0.0)
  # ───────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Build APKs
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs || true
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --split-per-abi
          flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Veloura ${{ github.ref_name }}
          body: |
            ## Veloura ${{ github.ref_name }}

            ### Install on Android
            1. Download the APK for your device (arm64 for modern phones)
            2. On your phone: Settings → Security → Install unknown apps → Enable
            3. Open the downloaded APK and tap Install

            ### APK files
            | File | For |
            |------|-----|
            | `app-arm64-v8a-release.apk` | Modern phones (2016+) — **recommended** |
            | `app-armeabi-v7a-release.apk` | Older phones |
            | `app-release.apk` | Universal (works on all Android devices) |
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
