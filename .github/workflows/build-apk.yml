name: Build Veloura APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fix Node.js 20 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs || true
        continue-on-error: true

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
        continue-on-error: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build split APKs
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --split-per-abi \
            --no-shrink

      - name: Build universal APK
        run: flutter build apk --release --no-shrink

      - name: List built APKs
        run: find build/app/outputs/flutter-apk/ -name "*.apk" -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: veloura-apks-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Build APKs
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs || true
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --split-per-abi \
            --no-shrink
          flutter build apk --release --no-shrink

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Veloura ${{ github.ref_name }}
          body: |
            ## Veloura ${{ github.ref_name }}
            ### Install
            1. Download app-arm64-v8a-release.apk (modern phones recommended)
            2. Phone Settings > Security > Install unknown apps > Allow
            3. Open the APK and tap Install
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
